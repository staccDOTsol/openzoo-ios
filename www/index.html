<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://zoo.openzoo.fun https://x402-tokens.fly.dev https://x402.accrue.fund https://api.mainnet-beta.solana.com https://solana-rpc.publicnode.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self'; media-src 'self';">
  <title>OpenZoo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }
    body {
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ececec;
      padding: 28px 16px 72px;
      overflow-y: auto;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px; margin: 8px 0 10px;
      display: flex; align-items: center; justify-content: center; font-size: 36px;
      background: #111; border: 1px solid #1c1c1e;
    }
    .title { font-size: 22px; font-weight: 700; letter-spacing: 4px; }
    .tagline { margin-top: 6px; font-size: 13px; color: #8e8e93; text-align: center; }
    #paywall { width: 100%; max-width: 420px; }
    #tiers { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 12px; }
    .tier {
      text-align: left; width: 100%;
      background: #111113; border: 1px solid #2c2c2e; color: #ececec;
      border-radius: 16px; padding: 14px 16px; font: inherit;
    }
    .tier.highlight { border-color: #b8f240; background: rgba(184,242,64,.06); }
    .tier .badge { display: inline-block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #0b0b0d; background: #b8f240; border-radius: 999px; padding: 2px 8px; margin-bottom: 6px; }
    .tier .name { font-weight: 700; font-size: 16px; }
    .tier .price { color: #b8f240; font-weight: 700; margin: 2px 0 6px; }
    .tier .meta { font-size: 12px; color: #8e8e93; line-height: 1.45; }
    .ghost, .btn {
      width: 100%; margin-top: 8px; border-radius: 12px; padding: 12px;
      font: inherit; background: #1c1c1e; color: #ececec; border: 1px solid #2c2c2e;
    }
    #status { margin-top: 12px; font-size: 12px; color: #8e8e93; text-align: center; min-height: 18px; }
    #dev-unlock { display: none; margin-top: 16px; }
    #dev-unlock.show { display: block; }
    #dev-email {
      width: 100%; border-radius: 10px; padding: 8px 10px; font: 12px/1.4 inherit;
      background: #0b0b0d; color: #8e8e93; border: 1px solid #2c2c2e;
    }
    .close { font-size: 12px; color: #6f7080; text-align: center; margin-top: 14px; line-height: 1.5; }
    #advanced { display: none; width: 100%; max-width: 420px; margin-top: 18px; }
    #advanced.show { display: block; }
    #picker, #connected { display: flex; flex-direction: column; gap: 10px; }
    #connected { display: none; }
    .addr { font: 12px/1.45 ui-monospace, Menlo, monospace; word-break: break-all; padding: 10px; border: 1px solid #1c1c1e; border-radius: 10px; -webkit-user-select: text; user-select: text; cursor: pointer; }
    #copiedToast { position: fixed; z-index: 80; left: 50%; top: 18px; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; background: #b8f240; color: #0b0b0d; font: 700 12px/1.2 -apple-system, sans-serif; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    #copiedToast.show { opacity: 1; }
    .powered { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 12px; font-size: 10px; letter-spacing: 1.4px; color: #4c4d5a; }
    #oz-boot {
      position: fixed; inset: 0; z-index: 10000;
      background: #0a0a12;
      display: flex; align-items: center; justify-content: center;
      color: #8e8e93;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .04em;
    }
    #oz-boot.hide { display: none; }
    #oz-boot .oz-dot {
      display: inline-block;
      animation: oz-boot-dot 1.2s infinite;
      opacity: .2;
    }
    #oz-boot .oz-dot:nth-child(2) { animation-delay: .2s; }
    #oz-boot .oz-dot:nth-child(3) { animation-delay: .4s; }
    #oz-boot .oz-dot:nth-child(4) { animation-delay: .6s; }
    @keyframes oz-boot-dot {
      0%, 20% { opacity: .2; }
      40% { opacity: 1; }
      100% { opacity: .2; }
    }
  </style>
</head>
<body>
  <div id="oz-boot" aria-live="polite" aria-busy="true"><span>starting</span><span class="oz-dot">.</span><span class="oz-dot">.</span><span class="oz-dot">.</span></div>
  <div id="copiedToast" role="status">copied</div>
  <div class="logo">🦓</div>
  <div class="title">OPENZOO</div>
  <div class="tagline" id="tagline">Subscription keys · no x402</div>

  <div id="paywall">
    <div id="tiers"></div>
    <button class="ghost" id="btn-restore" type="button">Restore purchases</button>
    <div id="dev-unlock">
      <input id="dev-email" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="dev">
    </div>
    <div id="status"></div>
    <p class="close" id="close-copy">No x402, no wallet, no per-call signing.</p>
  </div>

  <div id="advanced">
    <p class="close">Advanced · optional wallet. Not required to chat.</p>
    <div id="picker">
      <button class="btn" id="btn-phantom" type="button">Connect Phantom</button>
      <button class="btn" id="btn-solflare" type="button">Connect Solflare</button>
      <button class="btn" id="btn-burner" type="button">Use local burner</button>
    </div>
    <div id="connected">
      <div class="addr" id="addr"></div>
      <p class="close" id="disclaimer"></p>
      <button class="ghost" id="btn-disconnect" type="button">Disconnect wallet</button>
    </div>
  </div>

  <div class="powered">App Store subscription · CordovaSeeker · no Stripe checkout</div>

  <script src="cordova.js"></script>
  <script src="vendor/nacl-fast.min.js"></script>
  <script src="vendor/bs58.js"></script>
  <script src="js/openzoo-crypto.js"></script>
  <script src="js/user-errors.js"></script>
  <script src="js/clipboard.js"></script>
  <script src="js/solana.js"></script>
  <script src="js/wallet-ios.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/store-ios.js"></script>
  <script>
  'use strict';

  var connectedAddress = null;
  var connectedMethod = null;
  var catalog = null;
  var debugBuild = false;
  var testFlightBuild = false;
  var autoEnter = false;
  var GAME_URL = 'app/index.html';
  var GAME_ORIGIN = '*';
  var bootHideTimer = null;

  var $status = document.getElementById('status');
  var $tiers = document.getElementById('tiers');
  var $picker = document.getElementById('picker');
  var $connected = document.getElementById('connected');
  var $addr = document.getElementById('addr');
  var $disclaimer = document.getElementById('disclaimer');

  function log(msg) { console.log('[shell] ' + msg); }
  var toastTimer = null;
  function setStatus(msg) {
    if (!msg) { $status.textContent = ''; return; }
    $status.textContent = OpenZooUserErrors.sanitize(msg);
  }
  function showCopiedToast(label) {
    var el = document.getElementById('copiedToast');
    if (!el) return;
    el.textContent = label || 'copied';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1400);
  }
  function copyAddress(address, firstRunBurner) {
    if (!address) return Promise.resolve();
    return OpenZooClipboard.copyText(address).then(function () {
      showCopiedToast('copied');
      if (firstRunBurner || connectedMethod === 'burner') {
        setStatus('Copied your local burner address.');
      }
    });
  }

  function currentSub() {
    return OpenZooIOSStore.loadSubscription();
  }

  function showBoot() {
    var el = document.getElementById('oz-boot');
    if (!el) return;
    el.classList.remove('hide');
    el.setAttribute('aria-busy', 'true');
  }

  function hideBoot() {
    var el = document.getElementById('oz-boot');
    if (el) {
      el.classList.add('hide');
      el.setAttribute('aria-busy', 'false');
    }
    if (bootHideTimer) {
      clearTimeout(bootHideTimer);
      bootHideTimer = null;
    }
  }

  function armBootFallback() {
    if (bootHideTimer) clearTimeout(bootHideTimer);
    bootHideTimer = setTimeout(hideBoot, 4000);
  }

  function sendSubscription(iframe) {
    var sub = currentSub() || {};
    var target = iframe || document.getElementById('game');
    if (!target || !target.contentWindow) return;
    target.contentWindow.postMessage({
      type: 'subscription',
      tier: sub.tier || null,
      productId: sub.productId || null,
      key: sub.key || null,
      pending: !!sub.pending,
      localUnlock: !!((debugBuild || testFlightBuild) && sub.localUnlock),
      address: connectedAddress,
      method: connectedMethod
    }, GAME_ORIGIN);
  }

  function launchApp() {
    autoEnter = true;
    showBoot();
    armBootFallback();
    document.getElementById('paywall').style.display = 'none';
    document.getElementById('advanced').classList.remove('show');
    var old = document.getElementById('game');
    if (old) old.remove();
    var iframe = document.createElement('iframe');
    iframe.id = 'game';
    iframe.allow = 'fullscreen';
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;z-index:9999;';
    document.body.appendChild(iframe);
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      setTimeout(hideBoot, 50);
      setTimeout(function () {
        sendSubscription(iframe);
        if (connectedAddress) {
          iframe.contentWindow.postMessage({
            type: 'wallet-connected',
            address: connectedAddress,
            method: connectedMethod
          }, GAME_ORIGIN);
        }
      }, 200);
    });
    iframe.src = GAME_URL;
  }

  function showPaywall() {
    hideBoot();
    var iframe = document.getElementById('game');
    if (iframe) iframe.remove();
    document.getElementById('paywall').style.display = 'block';
  }

  function renderTiers(cat) {
    catalog = cat;
    document.getElementById('tagline').textContent = cat.tagline;
    document.getElementById('close-copy').textContent = cat.close +
      (cat.usageThresholdCents ? ' Usage invoices at $' + (cat.usageThresholdCents / 100).toFixed(2) + '.' : '');
    $tiers.innerHTML = '';
    cat.tiers.forEach(function (tier) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tier' + (tier.highlight ? ' highlight' : '');
      btn.innerHTML = (tier.highlight ? '<div class="badge"></div>' : '') +
        '<div class="name"></div><div class="price"></div><div class="meta"></div>';
      if (tier.highlight) btn.querySelector('.badge').textContent = tier.highlightLabel;
      btn.querySelector('.name').textContent = tier.name;
      btn.querySelector('.price').textContent = tier.priceLabel;
      btn.querySelector('.meta').textContent =
        (tier.savingsSharePct + '% savings share · ' + tier.rpm + ' rpm · bind ' +
        tier.maxBindLabel + ' · top-k ' + tier.maxTopK);
      btn.onclick = function () { subscribe(tier); };
      $tiers.appendChild(btn);
    });
  }

  function persistLocalUnlockAndEnter() {
    var saved = currentSub() || {};
    OpenZooIOSStore.saveSubscription(OpenZooIOSStore.applyLocalUnlock(saved));
    launchApp();
  }

  function tryDevUnlock() {
    if (!debugBuild) return;
    var email = (document.getElementById('dev-email').value || '').trim();
    if (!email) return;
    OpenZooIOSStore.debugUnlock(email).then(function () {
      persistLocalUnlockAndEnter();
    }).catch(function () {
      setStatus('Could not use that.');
    });
  }

  function persistAndEnter(receipt, exchange) {
    var sub = {
      productId: receipt.productId,
      tier: OpenZooBilling.tierIdForProduct(receipt.productId),
      jws: receipt.jws,
      originalTransactionId: receipt.originalTransactionId,
      key: (exchange && exchange.key) || '',
      pending: !(exchange && exchange.ok && exchange.key),
      todo: exchange && exchange.todo,
      updatedAt: Date.now()
    };
    OpenZooIOSStore.saveSubscription(sub);
    if (sub.pending) {
      setStatus(exchange && exchange.error ? exchange.error : 'Purchase saved. Waiting on the zoo to mint your key.');
    }
    launchApp();
  }

  function subscribe(tier) {
    setStatus('Starting App Store checkout for ' + tier.name + '…');
    OpenZooIOSStore.purchase(tier.productId).then(function (receipt) {
      return OpenZooBilling.exchangeAppStore({
        jws: receipt.jws,
        productId: receipt.productId,
        originalTransactionId: receipt.originalTransactionId,
        tier: tier.id
      }).then(function (ex) {
        persistAndEnter(receipt, ex);
      });
    }).catch(function (err) {
      setStatus(err.message || String(err));
    });
  }

  function restorePurchases() {
    setStatus('Restoring App Store purchases…');
    return OpenZooIOSStore.restore().then(function (rows) {
      var list = Array.isArray(rows) ? rows : [];
      if (!list.length) {
        setStatus('No App Store subscription to restore.');
        return;
      }
      var receipt = list[0];
      return OpenZooBilling.exchangeAppStore({
        jws: receipt.jws,
        productId: receipt.productId,
        originalTransactionId: receipt.originalTransactionId
      }).then(function (ex) {
        persistAndEnter(receipt, ex);
      });
    }).catch(function (err) {
      var msg = err.message || String(err);
      if (/cancel/i.test(msg)) {
        setStatus('No App Store subscription to restore.');
        return;
      }
      setStatus(msg);
    });
  }

  function showConnected(address, method, extra) {
    connectedAddress = address;
    connectedMethod = method;
    $picker.style.display = 'none';
    $connected.style.display = 'flex';
    $addr.textContent = address + ' · ' + method;
    $disclaimer.textContent = (extra && extra.disclaimer) || '';
    sendSubscription();
  }

  function disconnect() {
    var iframe = document.getElementById('game');
    if (iframe && connectedAddress) {
      try { iframe.contentWindow.postMessage({ type: 'wallet-disconnected' }, GAME_ORIGIN); } catch (_) {}
    }
    connectedAddress = null;
    connectedMethod = null;
    OpenZooIOSWallet.clearDeeplinkSession();
    $picker.style.display = 'flex';
    $connected.style.display = 'none';
    sendSubscription();
  }

  function respondToIframe(payload) {
    var iframe = document.getElementById('game');
    if (!iframe) return;
    iframe.contentWindow.postMessage(payload, GAME_ORIGIN);
  }

  document.getElementById('btn-restore').onclick = restorePurchases;
  document.getElementById('dev-email').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      tryDevUnlock();
    }
  });
  document.getElementById('dev-email').addEventListener('change', tryDevUnlock);
  document.getElementById('btn-phantom').onclick = function () {
    OpenZooIOSWallet.connectDeeplink('phantom').catch(function (err) { setStatus(err.message || String(err)); });
  };
  document.getElementById('btn-solflare').onclick = function () {
    OpenZooIOSWallet.connectDeeplink('solflare').catch(function (err) { setStatus(err.message || String(err)); });
  };
  document.getElementById('btn-burner').onclick = function () {
    OpenZooIOSWallet.loadBurner().then(function (existing) {
      var firstRun = !existing;
      return OpenZooIOSWallet.connectBurner().then(function (result) {
        showConnected(result.address, 'burner', result);
        if (firstRun) {
          return copyAddress(result.address, true).then(function () {
            setStatus('Copied your local burner. This key stays on this phone.');
          }).catch(function () {
            setStatus('This is your local burner. Tap the address to copy it.');
          });
        }
      });
    }).catch(function (err) { setStatus(err.message || String(err)); });
  };
  document.getElementById('btn-disconnect').onclick = disconnect;

  $addr.addEventListener('click', function () {
    copyAddress(connectedAddress, connectedMethod === 'burner');
  });
  document.addEventListener('resume', function () {
    var iframe = document.getElementById('game');
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage({ type: 'app-resume' }, GAME_ORIGIN);
    }
  }, false);
  window.handleOpenURL = function (url) {
    OpenZooIOSWallet.handleRedirectUrl(url).then(function (result) {
      if (!result) return;
      if (result.type === 'connected') {
        showConnected(result.address, result.method);
        return;
      }
      if (result.type === 'signed-tx') {
        respondToIframe({ type: 'wallet-sign-transaction-response', id: result.id, signedTransaction: result.signedTransaction });
        return;
      }
      if (result.type === 'signed-send-tx') {
        respondToIframe({ type: 'wallet-sign-and-send-transaction-response', id: result.id, signature: result.signature });
        return;
      }
      if (result.type === 'signed-msg') {
        respondToIframe({ type: 'wallet-sign-response', id: result.id, signature: result.signature });
      }
    }).catch(function (err) {
      var pending = err.pending || OpenZooIOSWallet.loadPersisted().pending;
      if (pending && pending.kind === 'sign-tx') {
        respondToIframe({ type: 'wallet-sign-transaction-response', id: pending.id, error: err.message || String(err) });
      } else if (pending && pending.kind === 'sign-send-tx') {
        respondToIframe({ type: 'wallet-sign-and-send-transaction-response', id: pending.id, error: err.message || String(err) });
      } else if (pending && pending.kind === 'sign-msg') {
        respondToIframe({ type: 'wallet-sign-response', id: pending.id, error: err.message || String(err) });
      }
      setStatus(err.message || String(err));
    });
  };

  window.addEventListener('message', function (event) {
    var gameFrame = document.getElementById('game');
    if (!gameFrame || event.source !== gameFrame.contentWindow) return;
    var data = event.data;
    if (!data || !data.type) return;

    if (data.type === 'openzoo-chrome-ready') { hideBoot(); return; }
    if (data.type === 'wallet-disconnect') { disconnect(); return; }
    if (data.type === 'show-paywall') { showPaywall(); return; }
    if (data.type === 'show-advanced-wallet') {
      document.getElementById('advanced').classList.add('show');
      showPaywall();
      return;
    }
    if (data.type === 'restore-purchases') { restorePurchases(); return; }
    if (data.type === 'subscription-request' || data.type === 'wallet-request-info') {
      sendSubscription(gameFrame);
      if (connectedAddress) {
        gameFrame.contentWindow.postMessage({ type: 'wallet-connected', address: connectedAddress, method: connectedMethod }, GAME_ORIGIN);
      }
      return;
    }

    if (data.type === 'wallet-sign-message') {
      var msgRespond = function (payload) {
        payload.type = 'wallet-sign-response';
        payload.id = data.id;
        respondToIframe(payload);
      };
      if (connectedMethod === 'burner') {
        OpenZooIOSWallet.signMessageBurner(data.message).then(function (r) { msgRespond({ signature: r.signature }); })
          .catch(function (err) { msgRespond({ error: err.message || String(err) }); });
        return;
      }
      if (connectedMethod === 'phantom' || connectedMethod === 'solflare') {
        OpenZooIOSWallet.signMessageDeeplink(data.message, data.id).catch(function (err) { msgRespond({ error: err.message || String(err) }); });
        return;
      }
      msgRespond({ error: 'No wallet connected' });
      return;
    }

    if (data.type === 'wallet-sign-transaction') {
      var txRespond = function (payload) {
        payload.type = 'wallet-sign-transaction-response';
        payload.id = data.id;
        respondToIframe(payload);
      };
      if (!data.transaction) { txRespond({ error: 'Missing unsigned transaction' }); return; }
      if (connectedMethod === 'burner') {
        OpenZooIOSWallet.signTransactionBurner(data.transaction).then(function (r) { txRespond({ signedTransaction: r.signedTransaction }); })
          .catch(function (err) { txRespond({ error: err.message || String(err) }); });
        return;
      }
      if (connectedMethod === 'phantom' || connectedMethod === 'solflare') {
        OpenZooIOSWallet.signTransactionDeeplink(data.transaction, data.id).catch(function (err) { txRespond({ error: err.message || String(err) }); });
        return;
      }
      txRespond({ error: 'No wallet connected' });
      return;
    }

    if (data.type === 'wallet-sign-and-send-transaction') {
      var sendRespond = function (payload) {
        payload.type = 'wallet-sign-and-send-transaction-response';
        payload.id = data.id;
        respondToIframe(payload);
      };
      if (!data.transaction) { sendRespond({ error: 'Missing unsigned transaction' }); return; }
      if (connectedMethod === 'burner') {
        OpenZooIOSWallet.signTransactionBurner(data.transaction).then(function (r) {
          return OpenZooSolana.sendRawTransaction(OpenZooCrypto.base64ToBytes(r.signedTransaction));
        }).then(function (signature) { sendRespond({ signature: signature }); })
          .catch(function (err) { sendRespond({ error: err.message || String(err) }); });
        return;
      }
      if (connectedMethod === 'phantom' || connectedMethod === 'solflare') {
        OpenZooIOSWallet.signAndSendTransactionDeeplink(data.transaction, data.id).catch(function (err) { sendRespond({ error: err.message || String(err) }); });
        return;
      }
      sendRespond({ error: 'No wallet connected' });
    }
  });

  function maybeLaunchFromSaved() {
    var saved = currentSub();
    if (!OpenZooIOSStore.hasAccess(saved, { debug: debugBuild, testFlight: testFlightBuild })) return false;
    autoEnter = true;
    if (saved.pending && saved.jws) {
      OpenZooBilling.exchangeAppStore(saved).then(function (ex) {
        if (ex.ok && ex.key) {
          saved.key = ex.key;
          saved.pending = false;
          OpenZooIOSStore.saveSubscription(saved);
        }
        launchApp();
      });
      return true;
    }
    launchApp();
    return true;
  }

  function boot() {
    OpenZooBilling.loadTiers().then(renderTiers);
    maybeLaunchFromSaved();
  }

  document.addEventListener('deviceready', function () {
    if (OpenZooIOSStore.pluginReady()) {
      OpenZooIOSStore.debugBuild().then(function (flag) {
        debugBuild = flag === true || flag === 'true' || flag === 1;
        if (debugBuild) document.getElementById('dev-unlock').classList.add('show');
        return OpenZooIOSStore.debugUnlockStatus();
      }).then(function (status) {
        if (debugBuild && status && status.unlocked) {
          persistLocalUnlockAndEnter();
          return;
        }
        return OpenZooIOSStore.testFlight().then(function (tf) {
          testFlightBuild = tf === true || tf === 'true' || tf === 1;
          if (testFlightBuild) {
            persistLocalUnlockAndEnter();
            return;
          }
          maybeLaunchFromSaved();
        });
      }).catch(function () {
        maybeLaunchFromSaved();
      });
      OpenZooIOSStore.entitlements().then(function (rows) {
        if ((!currentSub() || !currentSub().jws) && rows && rows[0]) {
          return OpenZooBilling.exchangeAppStore(rows[0]).then(function (ex) {
            persistAndEnter(rows[0], ex);
          });
        }
      }).catch(function () {});
    }
    var persisted = OpenZooIOSWallet.loadPersisted();
    if (persisted.address && persisted.method && persisted.method !== 'MWA') {
      if (persisted.method === 'burner') {
        OpenZooIOSWallet.connectBurner().then(function (result) {
          showConnected(result.address, 'burner', result);
        });
      } else if (persisted.session) {
        showConnected(persisted.address, persisted.method);
      }
    }
  }, false);

  function hideBootIfFirstRun() {
    if (!autoEnter) hideBoot();
  }

  boot();
  if (document.readyState === 'complete') hideBootIfFirstRun();
  else document.addEventListener('DOMContentLoaded', hideBootIfFirstRun);
  </script>
</body>
