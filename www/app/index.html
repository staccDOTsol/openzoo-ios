<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src https://x402-tokens.fly.dev https://x402.accrue.fund https://api.mainnet-beta.solana.com https://solana-rpc.publicnode.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline';">
  <title>OpenZoo</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="copiedToast" role="status">copied</div>
  <div id="scrim" class="hidden"></div>
  <aside id="sidebar">
    <div id="sideTop">
      <button class="icon-btn" id="new-thread" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <input id="search" placeholder="Search" autocomplete="off">
      <button class="icon-btn" id="close-sidebar" title="Close" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="threads"></div>
  </aside>

  <main id="main">
    <header id="chatHeader">
      <button class="icon-btn" id="menu-btn" aria-label="Chats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div id="chatHeaderId">
        <div class="tavatar" id="header-avatar">OZ</div>
        <div class="hname">
          <div id="header-name">New chat</div>
          <div class="hdir" id="header-sub">openzoo</div>
        </div>
      </div>
      <div id="headerDials">
        <select class="dial" id="model" aria-label="Model"></select>
        <button class="dial" id="wallet-btn" type="button">wallet</button>
        <button class="icon-btn" id="exit-btn" title="Back to shell">✕</button>
      </div>
    </header>

    <div id="log" aria-live="polite"></div>

    <div id="bar">
      <div id="plusMenu">
        <div class="pop-item" id="attach-files">Attach files</div>
        <div class="pop-item" id="attach-photos">Use photos</div>
        <div class="pop-item" id="attach-folder">Use a folder</div>
        <div class="pop-item" id="attach-paste">Paste text</div>
      </div>
      <input id="file-inp" type="file" multiple hidden>
      <input id="photo-inp" type="file" accept="image/*" multiple hidden>
      <input id="folder-inp" type="file" webkitdirectory multiple hidden>
      <div id="attachChips"></div>
      <div id="row-input">
        <div id="pill">
          <button class="icon-btn" id="plus-btn" type="button" aria-label="Attach">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <textarea id="inp" rows="1" placeholder="Message" autocomplete="off"></textarea>
        </div>
        <button id="send" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </main>

  <div id="walletOverlay">
    <div id="walletBox">
      <h3>Your wallet</h3>
      <p class="wsub" id="wallet-sub">This is the wallet the chat pays from. Connect it in the shell. Payments are signed here; a top-up may be sent first if this wallet needs it.</p>
      <div id="wallet-body"></div>
      <button class="dial" id="wallet-close" type="button">Close</button>
    </div>
  </div>

  <div id="modal" class="hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <h2 id="modal-title">Payment</h2>
      <p id="modal-lead"></p>
      <div id="modal-body"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <script src="../vendor/nacl-fast.min.js"></script>
  <script src="../vendor/bs58.js"></script>
  <script src="../js/openzoo-crypto.js"></script>
  <script src="../js/rails.js"></script>
  <script src="../js/solana.js"></script>
  <script src="../js/wrap.js"></script>
  <script src="app.js"></script>
</body>
</html>
